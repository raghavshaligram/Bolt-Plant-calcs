ical:`Yucca elephantipes`,group:`tree`,light:`direct`,water:`arid`,baseDays:16,humidity:`low`,size:`4–8 ft`,feed:`light`,mist:!1,repotYears:4,notes:`Wants more direct sun than most houseplants. Rot from overwatering is the usual end.`,toxicity:{verdict:`toxic`,matched:`Yucca spp.`,via:`genus`}},{id:`ponytail-palm`,common:`Ponytail Palm`,botanical:`Beaucarnea recurvata`,group:`succulent`,light:`direct`,water:`arid`,baseDays:21,humidity:`low`,size:`3–6 ft indoors`,feed:`light`,mist:!1,repotYears:4,notes:`Not a palm. The swollen base is a water store — treat it like a succulent.`,toxicity:{verdict:`non-toxic`,matched:`Beaucarnea recurvata`,via:`botanical`}},{id:`parlour-palm`,common:`Parlour Palm`,botanical:`Chamaedorea elegans`,group:`palm`,light:`medium`,water:`evenly-moist`,baseDays:8,humidity:`average`,size:`2–4 ft`,feed:`light`,mist:!0,repotYears:3,notes:`One of the few palms that genuinely copes with low light. Prone to spider mite in dry air.`,toxicity:{verdict:`non-toxic`,matched:`Chamaedorea elegans`,via:`botanical`}},{id:`kentia-palm`,common:`Kentia Palm`,botanical:`Howea forsteriana`,group:`palm`,light:`medium`,water:`dry-between`,baseDays:10,humidity:`average`,size:`6–10 ft indoors`,feed:`light`,mist:!0,repotYears:4,notes:`Expensive because it is slow. Very tolerant of low light and neglect once settled.`,toxicity:{verdict:`non-toxic`,matched:`Howea forsteriana`,via:`botanical`}},{id:`areca-palm`,common:`Areca Palm`,botanical:`Dypsis lutescens`,group:`palm`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`5–7 ft indoors`,feed:`average`,mist:!0,repotYears:3,notes:`Thirsty and humidity-hungry. Brown tips are almost always dry air or fluoride.`,toxicity:{verdict:`non-toxic`,matched:`Dypsis lutescens`,via:`botanical`}},{id:`majesty-palm`,common:`Majesty Palm`,botanical:`Ravenea rivularis`,group:`palm`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`4–8 ft indoors`,feed:`average`,mist:!0,repotYears:3,notes:`Sold everywher :`Calathea orbifolia`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`2–3 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Crisp edges mean tap water or dry air. Rainwater or distilled, and keep it off a radiator.`,toxicity:{verdict:`non-toxic`,matched:`Calathea spp.`,via:`genus`}},{id:`calathea-medallion`,common:`Calathea Medallion`,botanical:`Calathea roseopicta`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Folds its leaves up at night. Drooping in daylight is thirst or cold.`,toxicity:{verdict:`non-toxic`,matched:`Calathea spp.`,via:`genus`}},{id:`calathea-rattlesnake`,common:`Rattlesnake Plant`,botanical:`Goeppertia insignis`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`2–3 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Reclassified out of Calathea but sold under the old name everywhere.`,toxicity:{verdict:`unknown`}},{id:`maranta`,common:`Prayer Plant`,botanical:`Maranta leuconeura`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1 ft trailing`,feed:`light`,mist:!0,repotYears:2,notes:`Leaves fold at dusk and open at dawn. Stops doing it when it is unhappy.`,toxicity:{verdict:`non-toxic`,matched:`Maranta insignis`,via:`genus-sibling`}},{id:`stromanthe`,common:`Stromanthe Triostar`,botanical:`Stromanthe sanguinea`,group:`prayer`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`2–3 ft`,feed:`light`,mist:!0,repotYears:2,notes:`The pink is real variegation, not a dye. Needs bright light to keep it.`,toxicity:{verdict:`unknown`}},{id:`ctenanthe`,common:`Never Never Plant`,botanical:`Ctenanthe burle-marxii`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Same family and the same demands as Calathea — humidity and clean water.`,toxicity:{verdict:`unknown`}},{id:`rex-begonia`,common:`Rex Begonia`,botanical:`Begonia rex`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Grown for foliage, not flowers. Never mist — wet leaves invite mildew.`,toxicity:{verdict:`toxic`,matched:`Begonia rex`,via:`botanical`}},{id:`polka-dot-begonia`,common:`Polka Dot Begonia`,botanical:`Begonia maculata`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:7,humidity:`average`,size:`2–4 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Cane-type. Needs staking once it gets tall or it snaps under its own weight.`,toxicity:{verdict:`toxic`,matched:`Begonia spp.`,via:`genus`}},{id:`african-violet`,common:`African Violet`,botanical:`Saintpaulia ionantha`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`6–8 in`,feed:`average`,mist:!1,repotYears:2,notes:`Water from the bottom. Cold water on the leaves leaves permanent pale rings.`,toxicity:{verdict:`non-toxic`,matched:`Saintpaulia spp.`,via:`genus`}},{id:`anthurium`,common:`Flamingo Flower`,botanical:`Anthurium andraeanum`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`average`,mist:!0,repotYears:2,notes:`The red part is a spathe, not a petal. Blooms for months in enough light.`,toxicity:{verdict:`toxic`,matched:`Anthurium scherzeranum`,via:`genus-sibling`}},{id:`orchid-phal`,common:`Moth Orchid`,botanical:`Phalaenopsis spp.`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:7,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Not potted in soil. Bark mix, a soak once a week, and never leave it sitting in water.`,toxicity:{verdict:`non-toxic`,matched:`Phalaenopsis sp.`,via:`genus`}},{id:`christmas-cactus`,common:`Christmas Cactus`,botanical:`Schlumbergera bridgesii`,group:`succulent`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:3,note non-toxic`,matched:`Hoya carnosa`,via:`botanical`}},{id:`hoya-kerrii`,common:`Sweetheart Hoya`,botanical:`Hoya kerrii`,group:`vine`,light:`bright`,water:`arid`,baseDays:14,humidity:`low`,size:`trailing, slow`,feed:`light`,mist:!1,repotYears:4,notes:`A single leaf sold in a pot will usually never grow — it needs a node to become a plant.`,toxicity:{verdict:`non-toxic`,matched:`Hoya kerrii`,via:`botanical`}},{id:`schefflera`,common:`Umbrella Plant`,botanical:`Schefflera arboricola`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`4–8 ft indoors`,feed:`average`,mist:!1,repotYears:3,notes:`Gets leggy in low light. Prune hard and it branches.`,toxicity:{verdict:`toxic`,matched:`Schefflera`,via:`genus`}},{id:`umbrella-tree`,common:`Dwarf Umbrella Tree`,botanical:`Schefflera actinophylla`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`6–10 ft indoors`,feed:`average`,mist:!1,repotYears:3,notes:`The larger cousin, and better suited to a bright corner than a shelf.`,toxicity:{verdict:`toxic`,matched:`Schefflera`,via:`genus`}},{id:`croton`,common:`Croton`,botanical:`Codiaeum variegatum`,group:`foliage`,light:`direct`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`3–5 ft`,feed:`average`,mist:!0,repotYears:2,notes:`Colour needs strong light. Drops every leaf when moved, then regrows them.`,toxicity:{verdict:`unknown`}},{id:`aglaonema`,common:`Chinese Evergreen`,botanical:`Aglaonema commutatum`,group:`foliage`,light:`low`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:3,notes:`One of the genuinely low-light plants. Pink and red cultivars need more light than green ones.`,toxicity:{verdict:`toxic`,matched:`Aglaonema modestum`,via:`genus-sibling`}},{id:`dieffenbachia`,common:`Dumb Cane`,botanical:`Dieffenbachia seguine`,group:`foliage`,light:`medium`,water:`dry-between`,baseDays:9,humidity:`average`,size:`3–5 ft`,feed:`average`,mist:!1,repotYears:2,no doors`,feed:`light`,mist:!0,repotYears:3,notes:`Not a real pine and not frost hardy. Drops lower branches permanently if it dries out.`,toxicity:{verdict:`non-toxic`,matched:`Araucaria heterophylla`,via:`botanical`}},{id:`money-tree`,common:`Money Tree`,botanical:`Pachira aquatica`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`4–6 ft indoors`,feed:`light`,mist:!1,repotYears:3,notes:`The braid is done at the nursery. Yellow leaves are usually too much water.`,toxicity:{verdict:`non-toxic`,matched:`Pachira aquatica`,via:`botanical`}},{id:`lucky-bamboo`,common:`Lucky Bamboo`,botanical:`Dracaena sanderiana`,group:`foliage`,light:`medium`,water:`wet`,baseDays:7,humidity:`average`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:0,notes:`Not bamboo. Usually grown in water — change it fortnightly and keep it off tap water.`,toxicity:{verdict:`toxic`,matched:`Dracaena spp.`,via:`genus`}},{id:`air-plant`,common:`Air Plant`,botanical:`Tillandsia ionantha`,group:`other`,light:`bright`,water:`dry-between`,baseDays:7,humidity:`average`,size:`2–4 in`,feed:`light`,mist:!0,repotYears:0,notes:`No soil at all. Soak for 20 minutes weekly and shake it out — trapped water in the base rots it.`,toxicity:{verdict:`unknown`}},{id:`venus-flytrap`,common:`Venus Flytrap`,botanical:`Dionaea muscipula`,group:`carnivore`,light:`direct`,water:`wet`,baseDays:2,humidity:`high`,size:`4–6 in`,feed:`none`,mist:!1,repotYears:2,notes:`Distilled or rainwater only — tap water minerals kill it. Never feed it meat.`,toxicity:{verdict:`non-toxic`,matched:`Dionaea muscipula`,via:`botanical`}},{id:`pitcher-plant`,common:`Pitcher Plant`,botanical:`Sarracenia purpurea`,group:`carnivore`,light:`direct`,water:`wet`,baseDays:2,humidity:`high`,size:`1 ft`,feed:`none`,mist:!1,repotYears:2,notes:`Needs a cold winter dormancy. A windowsill all year round will exhaust it.`,toxicity:{verdict:`unknown`}},{id:`nepenthes`,common:`Tropical Pitcher Plant`,botanical:`Nepenthes ventricosa`,group:`carnivore`,light:`bright`,water:`wet`,baseDays:3,humidity:`high`,size:`1–2 ft`,feed:`none`,mist:!0,repotYears:2,notes:`Pitchers form only in high humidity. Distilled water, never fertiliser in the soil.`,toxicity:{verdict:`unknown`}},{id:`english-ivy`,common:`English Ivy`,botanical:`Hedera helix`,group:`vine`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`6–8 ft trailing`,feed:`light`,mist:!0,repotYears:2,notes:`Spider mites are near-inevitable in dry indoor air. Rinse the foliage monthly.`,toxicity:{verdict:`toxic`,matched:`Hedera helix`,via:`botanical`}},{id:`grape-ivy`,common:`Grape Ivy`,botanical:`Cissus rhombifolia`,group:`vine`,light:`medium`,water:`dry-between`,baseDays:8,humidity:`average`,size:`4–6 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Tougher than English ivy indoors and far less mite-prone.`,toxicity:{verdict:`non-toxic`,matched:`Cissus rhombifolia`,via:`botanical`}},{id:`swedish-ivy`,common:`Swedish Ivy`,botanical:`Plectranthus australis`,group:`vine`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`2–3 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Not ivy. Grows fast, roots from any cutting, and wants pinching often.`,toxicity:{verdict:`non-toxic`,matched:`Plectranthus australis`,via:`botanical`}},{id:`purple-passion`,common:`Purple Passion Plant`,botanical:`Gynura aurantiaca`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`The purple fuzz needs bright light. The flowers smell unpleasant — most people cut them off.`,toxicity:{verdict:`non-toxic`,matched:`Gynura aurantica`,via:`genus-sibling`}},{id:`nerve-hypoestes`,common:`Polka Dot Plant`,botanical:`Hypoestes phyllostachya`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:5,humidity:`high`,size:`1 ft`,feed:`light`,mist:!0,repotYears:1,notes:`Short-lived and leggy. Pinch constantly, and take cuttings before it gives up.`,toxicity:{verdict:`non-toxic`,matched:`Hypoestes phyllostachya`,via:`botanical`}},{id:`aluminium-plant`,common:`Aluminium Plant`,botanical:`Pilea cadierei`,group:`foliage`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`1 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Silver markings are natural. Cut back hard in spring to stop it sprawling.`,toxicity:{verdict:`non-toxic`,matched:`Pilea cadieri`,via:`genus-sibling`}},{id:`friendship-plant`,common:`Friendship Plant`,botanical:`Pilea involucrata`,group:`foliage`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`8–12 in`,feed:`light`,mist:!0,repotYears:2,notes:`Textured leaves hold water — a pebble tray suits it better than misting.`,toxicity:{verdict:`non-toxic`,matched:`Pilea involucrata`,via:`botanical`}},{id:`basil`,common:`Basil`,botanical:`Ocimum basilicum`,group:`herb`,light:`direct`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Pinch the flower spikes the moment they appear or the leaves turn bitter.`,toxicity:{verdict:`non-toxic`,matched:`Ocimum basilicum`,via:`botanical`},companion:`Basil`},{id:`mint`,common:`Mint`,botanical:`Mentha spicata`,group:`herb`,light:`bright`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Invasive in the ground. Keep it in a pot of its own, always.`,toxicity:{verdict:`toxic`,matched:`Mentha sp.`,via:`genus`},companion:`Mint`},{id:`rosemary`,common:`Rosemary`,botanical:`Salvia rosmarinus`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:9,humidity:`low`,size:`2–4 ft`,feed:`light`,mist:!1,repotYears:3,notes:`More rosemary is killed by overwatering than by cold. Sharp drainage matters most.`,toxicity:{verdict:`non-toxic`,matched:`Salvia officinalis`,via:`genus-sibling`}},{id:`thyme`,common:`Thyme`,botanical:`Thymus vulgaris`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:8,humidity:`low`,size:`6–12 in`,feed:`light`,mist:!1,repotYears:3,notes:`Mediterranean — poor soil and full sun. Rich compost makes it floppy and flavourless.`,toxicity:{verdict:`non-toxic`,matched:`Thymus vulgaris`,via:`botanical`}},{id:`oregano`,common:`Oregano`,botanical:`Origanum vulgare`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:6,humidity:`low`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Flavour is strongest just before it flowers.`,toxicity:{verdict:`toxic`,matched:`Origanum majorana`,via:`genus-sibling`}},{id:`parsley`,common:`Parsley`,botanical:`Petroselinum crispum`,group:`herb`,light:`bright`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Biennial — it bolts in its second year and that is the end of it.`,toxicity:{verdict:`toxic`,matched:`Petroselinum crispum`,via:`botanical`}},{id:`cilantro`,common:`Cilantro`,botanical:`Coriandrum sativum`,group:`herb`,light:`bright`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Bolts fast in heat. Sow a new pot every three weeks rather than fighting it.`,toxicity:{verdict:`non-toxic`,matched:`Coriandrum sativum`,via:`botanical`}},{id:`chives`,common:`Chives`,botanical:`Allium schoenoprasum`,group:`herb`,light:`direct`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`1 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Cut from the outside. Shearing the whole clump to the base sets it back weeks.`,toxicity:{verdict:`toxic`,matched:`Allium schoenoprasum`,via:`botanical`},companion:`Chives`},{id:`sage`,common:`Sage`,botanical:`Salvia officinalis`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:8,humidity:`low`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Woody and short-lived. Replace every three or four years.`,toxicity:{verdict:`non-toxic`,matched:`Salvia officinalis`,via:`botanical`}},{id:`dill`,common:`Dill`,botanical:`Anethum graveolens`,group:`herb`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2–3 ft`,feed:`light`,mist:!1,repotYears:1,notes:`Does not transplant well — sow it where it will grow.`,toxicity:{verdict:`non-toxic`,matched:`Anethum graveolena`,via:`genus-sibling`},companion:`Dill`},{id:`lemon-balm`,common:`Lemon Balm`,botanical:`Melissa officinalis`,group:`herb`,light:`bright`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Spreads like mint. Pot it.`,toxicity:{verdict:`non-toxic`,matched:`Melissa officinalis`,via:`botanical`}},{id:`lavender`,common:`Lavender`,botanical:`Lavandula angustifolia`,group:`herb`,light:`direct`,water:`arid`,baseDays:10,humidity:`low`,size:`2–3 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Wants poor, gritty, dry soil. Feeding it is how most people kill it.`,toxicity:{verdict:`toxic`,matched:`Lavender`,via:`common`}},{id:`tomato`,common:`Tomato`,botanical:`Solanum lycopersicum`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`3–8 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Water at the base and evenly — irregular watering is what splits fruit and causes blossom end rot.`,toxicity:{verdict:`toxic`,matched:`Solanum spp`,via:`genus`},companion:`Tomatoes`},{id:`pepper`,common:`Pepper`,botanical:`Capsicum annuum`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2–3 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Needs warmth more than anything. Cold nights stall it completely.`,toxicity:{verdict:`unknown`},companion:`Peppers`},{id:`cucumber`,common:`Cucumber`,botanical:`Cucumis sativus`,group:`vegetable`,light:`direct`,water:`wet`,baseDays:2,humidity:`average`,size:`4–6 ft vining`,feed:`heavy`,mist:!1,repotYears:1,notes:`Bitter fruit is usually irregular watering. Give it something to climb.`,toxicity:{verdict:`non-toxic`,matched:`Cucumis sativus`,via:`botanical`},companion:`Cucumbers`},{id:`lettuce`,common:`Lettuce`,botanical:`Lactuca sativa`,group:`vegetable`,light:`bright`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`8–12 in`,feed:`average`,mist:!1,repotYears:1,notes:`Bolts in heat. Afternoon shade buys weeks.`,toxicity:{verdict:`unknown`},companion:`Lettuce`},{id:`spinach`,common:`Spinach`,botanical:`Spinacia oleracea`,group:`vegetable`,light:`bright`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`8–12 in`,feed:`average`,mist:!1,repotYears:1,notes:`Cool-season. Sow in spring and again in autumn, not in midsummer.`,toxicity:{verdict:`unknown`}},{id:`kale`,common:`Kale`,botanical:`Brassica oleracea`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2–3 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Sweeter after a frost. Pick from the bottom up and it keeps producing.`,toxicity:{verdict:`unknown`},companion:`Kale`},{id:`carrot`,common:`Carrot`,botanical:`Daucus carota`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1 ft`,feed:`light`,mist:!1,repotYears:1,notes:`Forked roots come from stony or freshly manured soil, not from bad seed.`,toxicity:{verdict:`non-toxic`,matched:`Daucus carota var. sativa`,via:`genus-sibling`},companion:`Carrots`},{id:`radish`,common:`Radish`,botanical:`Raphanus sativus`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`6 in`,feed:`light`,mist:!1,repotYears:1,notes:`Ready in a month. All leaf and no root means too much nitrogen.`,toxicity:{verdict:`unknown`},companion:`Radishes`},{id:`beans-bush`,common:`Bush Beans`,botanical:`Phaseolus vulgaris`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2 ft`,feed:`light`,mist:!1,repotYears:1,notes:`Fixes its own nitrogen — do not feed it like a tomato.`,toxicity:{verdict:`unknown`},companion:`Beans`},{id:`peas`,common:`Peas`,botanical:`Pisum sativum`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`3–6 ft`,feed:`light`,mist:!1,repotYears:1,notes:`Cool-season and quick. Sow as soon as the soil can be worked.`,toxicity:{verdict:`unknown`}},{id:`onion`,common:`Onion`,botanical:`Allium cepa`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Bulb size is set by day length — pick a variety for your latitude.`,toxicity:{verdict:`toxic`,matched:`Allium cepa`,via:`botanical`},companion:`Onions`},{id:`courgette`,common:`Zucchini`,botanical:`Cucurbita pepo`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:2,humidity:`average`,size:`3–4 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`One plant feeds a household. Two feeds a street.`,toxicity:{verdict:`non-toxic`,matched:`Cucurbita pepo`,via:`botanical`}},{id:`strawberry`,common:`Strawberry`,botanical:`Fragaria × ananassa`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`8–12 in`,feed:`average`,mist:!1,repotYears:2,notes:`Runners drain the parent. Cut them off unless you want more plants.`,toxicity:{verdict:`non-toxic`,matched:`Fragaria`,via:`genus`}},{id:`philo-micans`,common:`Velvet Leaf Philodendron`,botanical:`Philodendron hederaceum var. hederaceum`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`high`,size:`3–6 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`The velvet finish only holds in humid air; in dry rooms new leaves come out matte and smaller.`,toxicity:{verdict:`toxic`,matched:`Philodendron spp`,via:`genus`}},{id:`philo-birkin`,common:`Philodendron Birkin`,botanical:`Philodendron 'Birkin'`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`A sport, so it can revert to plain green or go fully white. Remove all-white leaves — they cannot feed themselves.`,toxicity:{verdict:`toxic`,matched:`Philodendron spp`,via:`genus`}},{id:`philo-xanadu`,common:`Xanadu`,botanical:`Thaumatophyllum xanadu`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`2–4 ft wide`,feed:`average`,mist:!1,repotYears:3,notes:`Self-heading, so it stays a mound rather than climbing. Wider than it is tall.`,toxicity:{verdict:`unknown`}},{id:`philo-pink-princess`,common:`Pink Princess Philodendron`,botanical:`Philodendron erubescens 'Pink Princess'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`high`,size:`3–5 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Pink is variegation, not a flower. Half-pink leaves are the target; a fully pink leaf will brown off.`,toxicity:{verdict:`toxic`,matched:`Philodendron spp`,via:`genus`}},{id:`philo-congo`,common:`Rojo Congo`,botanical:`Philodendron 'Rojo Congo'`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`2–4 ft`,feed:`average`,mist:!1,repotYears:3,notes:`New leaves unfurl burgundy and settle to dark green. Wipe the leaves — they show dust badly.`,toxicity:{verdict:`toxic`,matched:`Philodendron spp`,via:`genus`}},{id:`monstera-deliciosa-variegata`,common:`Variegated Monstera`,botanical:`Monstera deliciosa 'Albo-Variegata'`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`5–7 ft indoors`,feed:`light`,mist:!1,repotYears:2,notes:`Slow, and the white sections photosynthesise nothing. Prune back to a variegated node if a plain green run takes over.`,toxicity:{verdict:`toxic`,matched:`Monstera deliciosa`,via:`genus-sibling`}},{id:`rhaphidophora`,common:`Mini Monstera`,botanical:`Rhaphidophora tetrasperma`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`average`,size:`4–8 ft climbing`,feed:`average`,mist:!1,repotYears:2,notes:`Not a monstera and not a philodendron. Fast on a pole, leggy without one.`,toxicity:{verdict:`unknown`}},{id:`epipremnum-cebu`,common:`Cebu Blue Pothos`,botanical:`Epipremnum pinnatum 'Cebu Blue'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`5–8 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Leaves stay small and silver-blue until it climbs; given a pole they fenestrate and change shape entirely.`,toxicity:{verdict:`toxic`,matched:`Epipremnum aureum`,via:`genus-sibling`}},{id:`epipremnum-neon`,common:`Neon Pothos`,botanical:`Epipremnum aureum 'Neon'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`5–8 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Brightest in good light — in a dim corner the neon dulls to ordinary green.`,toxicity:{verdict:`toxic`,matched:`Epipremnum aureum`,via:`genus-sibling`}},{id:`scindapsus`,common:`Silver Satin Pothos`,botanical:`Scindapsus pictus`,group:`vine`,light:`medium`,water:`dry-between`,baseDays:10,humidity:`average`,size:`4–6 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`The silver is a surface layer; do not scrub it. Tolerates a dim room better than most trailers.`,toxicity:{verdict:`toxic`,matched:`Scindapsus pictus`,via:`botanical`}},{id:`aglaonema-siam`,common:`Siam Aurora`,botanical:`Aglaonema 'Siam Aurora'`,group:`foliage`,light:`medium`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:3,notes:`The red holds in medium light, unlike most coloured foliage. Sulks below 15°C.`,toxicity:{verdict:`toxic`,matched:`Aglaonema modestum`,via:`genus-sibling`}},{id:`aglaonema-silver-bay`,common:`Silver Bay`,botanical:`Aglaonema 'Silver Bay'`,group:`foliage`,light:`low`,water:`dry-between`,baseDays:11,humidity:`average`,size:`2–3 ft`,feed:`light`,mist:!1,repotYears:3,notes:`One of the genuinely low-light-tolerant plants in this list, and forgiving of a missed week.`,toxicity:{verdict:`toxic`,matched:`Aglaonema modestum`,via:`genus-sibling`}},{id:`alocasia-frydek`,common:`Alocasia Frydek`,botanical:`Alocasia micholitziana 'Frydek'`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–3 ft`,feed:`average`,mist:!0,repotYears:2,notes:`Goes dormant rather than dying when unhappy — if it drops every leaf, keep the tuber barely moist and wait.`,toxicity:{verdict:`toxic`,matched:`Alocasia spp.`,via:`genus`}},{id:`alocasia-black-velvet`,common:`Black Velvet Alocasia`,botanical:`Alocasia reginula`,group:`foliage`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`8–14 in`,feed:`light`,mist:!1,repotYears:2,notes:`Small and slow. The velvet leaves mark with water spots, so water the soil and not the plant.`,toxicity:{verdict:`toxic`,matched:`Alocasia spp.`,via:`genus`}},{id:`alocasia-dragon`,common:`Dragon Scale Alocasia`,botanical:`Alocasia baginda 'Dragon Scale'`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Textured leaves trap dust and spider mites. Check the undersides monthly.`,toxicity:{verdict:`toxic`,matched:`Alocasia spp.`,via:`genus`}},{id:`xanthosoma`,common:`Lime Zinger`,botanical:`Xanthosoma aurea 'Lime Zinger'`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`3–5 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Thirsty and fast in warmth. Outdoors in summer it doubles; indoors it slows right down.`,toxicity:{verdict:`unknown`}},{id:`anthurium-clarinervium`,common:`Velvet Cardboard Anthurium`,botanical:`Anthurium clarinervium`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Grown for the white veining, not flowers. Wants a chunky bark mix, not potting compost.`,toxicity:{verdict:`toxic`,matched:`Anthurium scherzeranum`,via:`genus-sibling`}},{id:`anthurium-crystallinum`,common:`Crystal Anthurium`,botanical:`Anthurium crystallinum`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`New leaves emerge coppery and soft, then harden. Do not touch them while they unfurl.`,toxicity:{verdict:`toxic`,matched:`Anthurium scherzeranum`,via:`genus-sibling`}},{id:`spathiphyllum-sensation`,common:`Sensation Peace Lily`,botanical:`Spathiphyllum 'Sensation'`,group:`flowering`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`3–5 ft`,feed:`average`,mist:!1,repotYears:3,notes:`The largest peace lily sold. Same wilting habit as the small one, but a full-size plant droops hard enough to look dead.`,toxicity:{verdict:`toxic`,matched:`Spathiphyllum`,via:`genus`}},{id:`homalomena`,common:`Queen of Hearts`,botanical:`Homalomena rubescens`,group:`foliage`,light:`medium`,water:`dry-between`,baseDays:9,humidity:`average`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Red stems, heart leaves, and far less fuss than the aroids it resembles.`,toxicity:{verdict:`unknown`}},{id:`dieffenbachia-camille`,common:`Camille Dumb Cane`,botanical:`Dieffenbachia 'Camille'`,group:`foliage`,light:`medium`,water:`dry-between`,baseDays:9,humidity:`average`,size:`2–3 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Sap irritates mouth and throat — the common name is literal. Wash hands after pruning.`,toxicity:{verdict:`toxic`,matched:`Dieffenbachia`,via:`genus`}},{id:`aspidistra-variegata`,common:`Variegated Cast Iron Plant`,botanical:`Aspidistra elatior 'Variegata'`,group:`foliage`,light:`low`,water:`dry-between`,baseDays:14,humidity:`low`,size:`2 ft`,feed:`none`,mist:!1,repotYears:4,notes:`Slower and fussier about light than the plain form; too much feed turns the stripes green.`,toxicity:{verdict:`non-toxic`,matched:`Aspidistra elatior`,via:`genus-sibling`}},{id:`ficus-lyrata-bambino`,common:`Bambino Fiddle Leaf`,botanical:`Ficus lyrata 'Bambino'`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`2–3 ft`,feed:`average`,mist:!1,repotYears:3,notes:`A dwarf, so it stays a tabletop plant. Same intolerance of being moved as the full-size tree.`,toxicity:{verdict:`toxic`,matched:`Ficus sp.`,via:`genus`}},{id:`ficus-benjamina-variegata`,common:`Variegated Weeping Fig`,botanical:`Ficus benjamina 'Starlight'`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`4–6 ft indoors`,feed:`average`,mist:!1,repotYears:3,notes:`Drops leaves at any change — light, draught, new pot. Leaf fall after a move is normal, not a diagnosis.`,toxicity:{verdict:`toxic`,matched:`Ficus sp.`,via:`genus`}},{id:`ficus-ginseng`,common:`Ginseng Ficus`,botanical:`Ficus microcarpa`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:3,notes:`The swollen root is the point. Sold as bonsai; prune the top to keep the proportion.`,toxicity:{verdict:`toxic`,matched:`Ficus sp.`,via:`genus`}},{id:`ficus-triangularis`,common:`Triangle Ficus`,botanical:`Ficus triangularis`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`2–4 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Thicker leaves than benjamina and far less prone to dropping them.`,toxicity:{verdict:`toxic`,matched:`Ficus sp.`,via:`genus`}},{id:`umbrella-plant-gold`,common:`Gold Capella Schefflera`,botanical:`Schefflera arboricola 'Gold Capella'`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`3–5 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Goes leggy fast in low light. Cut it back hard in spring and it branches rather than stretching.`,toxicity:{verdict:`toxic`,matched:`Schefflera`,via:`genus`}},{id:`polyscias`,common:`Ming Aralia`,botanical:`Polyscias fruticosa`,group:`tree`,light:`bright`,water:`evenly-moist`,baseDays:8,humidity:`high`,size:`3–6 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Drops leaves in dry winter air and looks dead for a month, then re-flushes. Do not repot it in a sulk.`,toxicity:{verdict:`toxic`,matched:`Polyscias guilfoylei`,via:`genus-sibling`}},{id:`fatsia`,common:`Japanese Aralia`,botanical:`Fatsia japonica`,group:`foliage`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`3–6 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Wants a cool room. Above 22°C all winter it goes soft and pale.`,toxicity:{verdict:`non-toxic`,matched:`Fatsia japonica`,via:`botanical`}},{id:`aralia-fabian`,common:`Fabian Stump Aralia`,botanical:`Polyscias scutellaria 'Fabian'`,group:`tree`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`3–5 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Sold as a grafted stump. Water at the base only; the trunk rots if it sits wet.`,toxicity:{verdict:`toxic`,matched:`Polyscias guilfoylei`,via:`genus-sibling`}},{id:`crassula-gollum`,common:`Gollum Jade`,botanical:`Crassula ovata 'Gollum'`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`1–2 ft`,feed:`none`,mist:!1,repotYears:4,notes:`Tubular leaves with red tips in strong sun. Green tips mean it wants more light, not more water.`,toxicity:{verdict:`toxic`,matched:`Crassula arborescens`,via:`genus-sibling`}},{id:`crassula-arborescens`,common:`Silver Dollar Jade`,botanical:`Crassula arborescens`,group:`succulent`,light:`direct`,water:`arid`,baseDays:20,humidity:`low`,size:`2–3 ft`,feed:`none`,mist:!1,repotYears:4,notes:`Blue-grey coin leaves. Slower than common jade and even less tolerant of a wet winter.`,toxicity:{verdict:`toxic`,matched:`Crassula arborescens`,via:`botanical`}},{id:`graptopetalum`,common:`Ghost Plant`,botanical:`Graptopetalum paraguayense`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`8–12 in`,feed:`none`,mist:!1,repotYears:3,notes:`Powder-coated leaves; handling rubs it off permanently. Drops leaves readily and each one is a new plant.`,toxicity:{verdict:`non-toxic`,matched:`Ghost Plant`,via:`common`}},{id:`sempervivum`,common:`Hens and Chicks`,botanical:`Sempervivum tectorum`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`4–8 in`,feed:`none`,mist:!1,repotYears:3,notes:`Hardy outdoors through frost. The main rosette dies after flowering — that is the plant finishing, not failing.`,toxicity:{verdict:`unknown`}},{id:`kalanchoe-blossfeldiana`,common:`Flaming Katy`,botanical:`Kalanchoe blossfeldiana`,group:`flowering`,light:`direct`,water:`arid`,baseDays:14,humidity:`low`,size:`8–16 in`,feed:`light`,mist:!1,repotYears:2,notes:`Re-blooms only after about six weeks of long, uninterrupted nights. A lamp in the room is enough to stop it.`,toxicity:{verdict:`toxic`,matched:`Kalanchoe spp`,via:`genus`}},{id:`kalanchoe-tomentosa`,common:`Panda Plant`,botanical:`Kalanchoe tomentosa`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`1–2 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Furry leaves hold water against the surface — water the soil, never overhead.`,toxicity:{verdict:`toxic`,matched:`Kalanchoe spp`,via:`genus`}},{id:`kalanchoe-daigremontiana`,common:`Mother of Thousands`,botanical:`Kalanchoe daigremontiana`,group:`succulent`,light:`direct`,water:`arid`,baseDays:16,humidity:`low`,size:`1–3 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Drops plantlets from every leaf edge and they root in any nearby pot. Keep it away from other plants.`,toxicity:{verdict:`toxic`,matched:`Kalanchoe spp`,via:`genus`}},{id:`euphorbia-trigona`,common:`African Milk Tree`,botanical:`Euphorbia trigona`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`3–6 ft`,feed:`none`,mist:!1,repotYears:4,notes:`Not a cactus. The white sap burns skin and eyes — gloves, and never prune it near your face.`,toxicity:{verdict:`toxic`,matched:`Euphorbia tirucalli`,via:`genus-sibling`}},{id:`euphorbia-tirucalli`,common:`Firestick`,botanical:`Euphorbia tirucalli 'Sticks on Fire'`,group:`succulent`,light:`direct`,water:`arid`,baseDays:20,humidity:`low`,size:`3–6 ft`,feed:`none`,mist:!1,repotYears:4,notes:`The orange only develops in full sun and cool nights. Same caustic sap as the rest of the genus.`,toxicity:{verdict:`toxic`,matched:`Euphorbia tirucalli`,via:`genus-sibling`}},{id:`opuntia`,common:`Prickly Pear`,botanical:`Opuntia microdasys`,group:`succulent`,light:`direct`,water:`arid`,baseDays:24,humidity:`low`,size:`1–2 ft`,feed:`none`,mist:!1,repotYears:4,notes:`The fine golden tufts are glochids and are far worse than spines — they detach on contact and are hard to remove.`,toxicity:{verdict:`non-toxic`,matched:`Opuntia species`,via:`genus`}},{id:`mammillaria`,common:`Pincushion Cactus`,botanical:`Mammillaria spp.`,group:`succulent`,light:`direct`,water:`arid`,baseDays:24,humidity:`low`,size:`4–8 in`,feed:`none`,mist:!1,repotYears:4,notes:`Flowers in a ring around the crown if given a dry, cold winter rest with no water at all.`,toxicity:{verdict:`non-toxic`,matched:`Mammillaria fragilis`,via:`genus-sibling`}},{id:`gymnocalycium`,common:`Moon Cactus`,botanical:`Gymnocalycium mihanovichii`,group:`succulent`,light:`bright`,water:`arid`,baseDays:21,humidity:`low`,size:`3–6 in`,feed:`none`,mist:!1,repotYears:4,notes:`The coloured top is a mutant with no chlorophyll, grafted onto the green base. It lives only as long as the graft does.`,toxicity:{verdict:`unknown`}},{id:`echinocactus`,common:`Golden Barrel Cactus`,botanical:`Echinocactus grusonii`,group:`succulent`,light:`direct`,water:`arid`,baseDays:28,humidity:`low`,size:`1–3 ft`,feed:`none`,mist:!1,repotYears:5,notes:`Very slow. A specimen the size of a football is decades old, which is what you are paying for.`,toxicity:{verdict:`unknown`}},{id:`schlumbergera-easter`,common:`Easter Cactus`,botanical:`Rhipsalidopsis gaertneri`,group:`succulent`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Not a desert cactus. Needs more water than it looks like, and buds drop if it is moved while setting.`,toxicity:{verdict:`unknown`}},{id:`rhipsalis`,common:`Mistletoe Cactus`,botanical:`Rhipsalis baccifera`,group:`succulent`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`2–4 ft trailing`,feed:`light`,mist:!0,repotYears:3,notes:`A jungle cactus that grows in tree forks — it wants humidity and shade, not a windowsill bake.`,toxicity:{verdict:`non-toxic`,matched:`Rhipsalis cassutha`,via:`genus-sibling`}},{id:`epiphyllum`,common:`Fishbone Cactus`,botanical:`Disocactus anguliger`,group:`succulent`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`2–3 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Night-flowering, one night only, strongly scented. Buds form after a cool dry spell.`,toxicity:{verdict:`unknown`}},{id:`senecio-string-of-bananas`,common:`String of Bananas`,botanical:`Curio radicans`,group:`succulent`,light:`bright`,water:`arid`,baseDays:14,humidity:`low`,size:`3–5 ft trailing`,feed:`none`,mist:!1,repotYears:3,notes:`Faster and far more forgiving than string of pearls, and it fails the same way — from the top, in wet compost.`,toxicity:{verdict:`unknown`}},{id:`senecio-string-of-dolphins`,common:`String of Dolphins`,botanical:`Curio × peregrinus`,group:`succulent`,light:`bright`,water:`arid`,baseDays:14,humidity:`low`,size:`2–3 ft trailing`,feed:`none`,mist:!1,repotYears:3,notes:`The dolphin shape only forms on mature growth in good light; new strands come out plain.`,toxicity:{verdict:`unknown`}},{id:`ceropegia-string-of-spades`,common:`String of Spades`,botanical:`Ceropegia woodii 'Heartless'`,group:`vine`,light:`bright`,water:`arid`,baseDays:14,humidity:`low`,size:`3–6 ft trailing`,feed:`none`,mist:!1,repotYears:3,notes:`Forms tubers along the strands. Pin one onto compost and it roots without cutting anything.`,toxicity:{verdict:`unknown`}},{id:`peperomia-hope`,common:`Peperomia Hope`,botanical:`Peperomia tetraphylla 'Hope'`,group:`succulent`,light:`bright`,water:`dry-between`,baseDays:12,humidity:`average`,size:`1 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Semi-succulent leaves — it stores water, so treat it as a succulent rather than a peperomia.`,toxicity:{verdict:`non-toxic`,matched:`Peperomia obtusifolia`,via:`genus-sibling`}},{id:`gasteria`,common:`Ox Tongue`,botanical:`Gasteria bicolor`,group:`succulent`,light:`medium`,water:`arid`,baseDays:20,humidity:`low`,size:`6–10 in`,feed:`none`,mist:!1,repotYears:4,notes:`The most shade-tolerant common succulent. Tolerates a north window where echeverias stretch.`,toxicity:{verdict:`unknown`}},{id:`agave`,common:`Century Plant`,botanical:`Agave americana`,group:`succulent`,light:`direct`,water:`arid`,baseDays:21,humidity:`low`,size:`3–6 ft`,feed:`none`,mist:!1,repotYears:5,notes:`Spine-tipped and genuinely dangerous at eye height. Dies after flowering, once, after decades.`,toxicity:{verdict:`unknown`}},{id:`adenium`,common:`Desert Rose`,botanical:`Adenium obesum`,group:`succulent`,light:`direct`,water:`arid`,baseDays:14,humidity:`low`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:3,notes:`The swollen caudex is a water store; a soft one means rot has already started. Drops all leaves in winter.`,toxicity:{verdict:`toxic`,matched:`Adenium obesum`,via:`botanical`}},{id:`pachypodium`,common:`Madagascar Palm`,botanical:`Pachypodium lamerei`,group:`succulent`,light:`direct`,water:`arid`,baseDays:18,humidity:`low`,size:`2–5 ft`,feed:`light`,mist:!1,repotYears:4,notes:`Neither a palm nor a cactus. Deciduous — bare in winter is the plant resting, not dying.`,toxicity:{verdict:`unknown`}},{id:`lithops`,common:`Living Stones`,botanical:`Lithops spp.`,group:`succulent`,light:`direct`,water:`arid`,baseDays:30,humidity:`low`,size:`1–2 in`,feed:`none`,mist:!1,repotYears:5,notes:`Do not water while a new pair of leaves is absorbing the old one. Watering then splits the plant.`,toxicity:{verdict:`non-toxic`,matched:`Lithops naureeniae`,via:`genus-sibling`}},{id:`aeonium`,common:`Black Rose Aeonium`,botanical:`Aeonium arboreum 'Zwartkop'`,group:`succulent`,light:`direct`,water:`arid`,baseDays:12,humidity:`low`,size:`2–3 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Grows in winter and rests in summer — the opposite of most succulents. Summer leaf drop is normal.`,toxicity:{verdict:`unknown`}},{id:`portulacaria`,common:`Elephant Bush`,botanical:`Portulacaria afra`,group:`succulent`,light:`direct`,water:`arid`,baseDays:14,humidity:`low`,size:`2–4 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Takes hard pruning and is often trained as bonsai. Edible, mildly sour — unlike the jade it resembles.`,toxicity:{verdict:`unknown`}},{id:`cotyledon`,common:`Bear's Paw`,botanical:`Cotyledon tomentosa`,group:`succulent`,light:`direct`,water:`arid`,baseDays:16,humidity:`low`,size:`8–12 in`,feed:`none`,mist:!1,repotYears:3,notes:`The red claw tips need direct sun. Loses leaves at the base if watered overhead.`,toxicity:{verdict:`unknown`}},{id:`asparagus-fern`,common:`Asparagus Fern`,botanical:`Asparagus setaceus`,group:`fern`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`2–3 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Not a fern at all — it flowers and sets berries, and it has thorns on older stems.`,toxicity:{verdict:`toxic`,matched:`Asparagus densiflorus cv sprengeri`,via:`genus-sibling`}},{id:`foxtail-fern`,common:`Foxtail Fern`,botanical:`Asparagus densiflorus 'Myersii'`,group:`fern`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`2 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Stores water in tuberous roots, so it forgives a missed week that would kill a true fern.`,toxicity:{verdict:`toxic`,matched:`Asparagus densiflorus cv sprengeri`,via:`genus-sibling`}},{id:`button-fern`,common:`Button Fern`,botanical:`Pellaea rotundifolia`,group:`fern`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`8–12 in`,feed:`light`,mist:!0,repotYears:2,notes:`The one small fern that tolerates ordinary room humidity, though it still resents drying out fully.`,toxicity:{verdict:`non-toxic`,matched:`Pellaea rotundifolia`,via:`botanical`}},{id:`kimberley-queen`,common:`Kimberley Queen Fern`,botanical:`Nephrolepis obliterata`,group:`fern`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`2–3 ft`,feed:`average`,mist:!0,repotYears:2,notes:`Sheds far less than a Boston fern, which is usually why people buy it.`,toxicity:{verdict:`non-toxic`,matched:`Nephrolepis biserrata`,via:`genus-sibling`}},{id:`blue-star-fern`,common:`Blue Star Fern`,botanical:`Phlebodium aureum`,group:`fern`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Grows from a furry surface rhizome — bury that and it rots. Sensitive to chlorine; use filtered water.`,toxicity:{verdict:`unknown`}},{id:`crocodile-fern`,common:`Crocodile Fern`,botanical:`Microsorum musifolium`,group:`fern`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Wants genuinely humid air. In a dry room it browns at the edges within weeks whatever the watering.`,toxicity:{verdict:`unknown`}},{id:`autumn-fern`,common:`Autumn Fern`,botanical:`Dryopteris erythrosora`,group:`fern`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Hardy outdoors to about -20°C. New fronds emerge copper and green up over a few weeks.`,toxicity:{verdict:`unknown`}},{id:`lemon-button-fern`,common:`Lemon Button Fern`,botanical:`Nephrolepis cordifolia 'Duffii'`,group:`fern`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`8–12 in`,feed:`light`,mist:!0,repotYears:2,notes:`Faintly lemon-scented when brushed. The most compact of the Boston fern relatives.`,toxicity:{verdict:`non-toxic`,matched:`Nephrolepis biserrata`,via:`genus-sibling`}},{id:`chinese-fan-palm`,common:`Chinese Fan Palm`,botanical:`Livistona chinensis`,group:`palm`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`4–8 ft indoors`,feed:`average`,mist:!1,repotYears:3,notes:`Slow indoors. Leaf tips brown on every palm in dry air — trim following the natural edge, not straight across.`,toxicity:{verdict:`unknown`}},{id:`lady-palm`,common:`Lady Palm`,botanical:`Rhapis excelsa`,group:`palm`,light:`medium`,water:`evenly-moist`,baseDays:8,humidity:`average`,size:`3–6 ft`,feed:`light`,mist:!1,repotYears:4,notes:`Tolerates lower light than any other palm sold indoors, and lives for decades in the same pot.`,toxicity:{verdict:`non-toxic`,matched:`Rhapis flabelliformis`,via:`genus-sibling`}},{id:`sago-palm`,common:`Sago Palm`,botanical:`Cycas revoluta`,group:`palm`,light:`bright`,water:`dry-between`,baseDays:12,humidity:`low`,size:`2–4 ft`,feed:`light`,mist:!1,repotYears:4,notes:`A cycad, not a palm. Every part is severely toxic to dogs and cats — keep it out of reach entirely.`,toxicity:{verdict:`toxic`,matched:`Cycas and Zamia species`,via:`genus-sibling`}},{id:`pygmy-date-palm`,common:`Pygmy Date Palm`,botanical:`Phoenix roebelenii`,group:`palm`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`average`,size:`4–6 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Has spines at the frond base near the trunk. Wear gloves when cleaning out old fronds.`,toxicity:{verdict:`non-toxic`,matched:`Phoenix canariensis`,via:`genus-sibling`}},{id:`cat-palm`,common:`Cat Palm`,botanical:`Chamaedorea cataractarum`,group:`palm`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`3–4 ft`,feed:`average`,mist:!0,repotYears:3,notes:`Clumping and thirsty — it grows beside streams in the wild and shows it the moment the pot dries.`,toxicity:{verdict:`non-toxic`,matched:`Chamaedorea elegans`,via:`genus-sibling`}},{id:`bamboo-palm`,common:`Bamboo Palm`,botanical:`Chamaedorea seifrizii`,group:`palm`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`4–6 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Handles a dim corner better than areca and is far less prone to spider mite.`,toxicity:{verdict:`non-toxic`,matched:`Chamaedorea elegans`,via:`genus-sibling`}},{id:`calathea-white-fusion`,common:`Calathea White Fusion`,botanical:`Goeppertia lietzei 'White Fusion'`,group:`prayer`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1 ft`,feed:`light`,mist:!0,repotYears:2,notes:`The hardest calathea sold. Tap water minerals brown the white sections within a month — use distilled.`,toxicity:{verdict:`unknown`}},{id:`calathea-ornata`,common:`Pinstripe Calathea`,botanical:`Goeppertia ornata`,group:`prayer`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Pink pinstripes fade with age on each leaf; that is normal, not a care failure.`,toxicity:{verdict:`unknown`}},{id:`calathea-lancifolia`,common:`Rattlesnake Calathea`,botanical:`Goeppertia lancifolia`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Wavy leaf edges are the species, not dehydration. Judge thirst by the soil, not the leaf shape.`,toxicity:{verdict:`unknown`}},{id:`maranta-lemon-lime`,common:`Lemon Lime Maranta`,botanical:`Maranta leuconeura 'Lemon Lime'`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1 ft trailing`,feed:`light`,mist:!0,repotYears:2,notes:`Folds up at night and reopens by morning. A plant that stays folded at midday is thirsty.`,toxicity:{verdict:`non-toxic`,matched:`Maranta insignis`,via:`genus-sibling`}},{id:`calathea-makoyana`,common:`Peacock Plant`,botanical:`Goeppertia makoyana`,group:`prayer`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:2,notes:`Thin papery leaves show every mistake. Keep it away from radiators and draughts both.`,toxicity:{verdict:`non-toxic`,matched:`Peacock Plant`,via:`common`}},{id:`sundew`,common:`Cape Sundew`,botanical:`Drosera capensis`,group:`carnivore`,light:`direct`,water:`wet`,baseDays:2,humidity:`high`,size:`6–12 in`,feed:`none`,mist:!1,repotYears:2,notes:`Stand the pot in rainwater or distilled. Tap water kills every carnivorous plant in this list within weeks.`,toxicity:{verdict:`unknown`}},{id:`butterwort`,common:`Butterwort`,botanical:`Pinguicula moranensis`,group:`carnivore`,light:`bright`,water:`wet`,baseDays:3,humidity:`high`,size:`3–5 in`,feed:`none`,mist:!1,repotYears:2,notes:`Catches fungus gnats on its sticky leaves, which is why people keep it near other houseplants.`,toxicity:{verdict:`unknown`}},{id:`cobra-lily`,common:`Cobra Lily`,botanical:`Darlingtonia californica`,group:`carnivore`,light:`bright`,water:`wet`,baseDays:2,humidity:`high`,size:`1–2 ft`,feed:`none`,mist:!1,repotYears:3,notes:`Wants cold roots and warm tops — it grows in mountain seeps. The hardest of the common carnivores.`,toxicity:{verdict:`non-toxic`,matched:`Darlingtonia californica`,via:`botanical`}},{id:`tillandsia-xerographica`,common:`Xerographica Air Plant`,botanical:`Tillandsia xerographica`,group:`other`,light:`bright`,water:`arid`,baseDays:10,humidity:`low`,size:`1–2 ft across`,feed:`light`,mist:!1,repotYears:0,notes:`Soak for 20 minutes, then shake it out and dry it upside down. Water left in the centre rots the crown.`,toxicity:{verdict:`unknown`}},{id:`spanish-moss`,common:`Spanish Moss`,botanical:`Tillandsia usneoides`,group:`other`,light:`bright`,water:`evenly-moist`,baseDays:4,humidity:`high`,size:`2–6 ft draping`,feed:`light`,mist:!0,repotYears:0,notes:`Needs misting several times a week in a normal room; it has no roots and no reservoir.`,toxicity:{verdict:`unknown`}},{id:`orchid-dendrobium`,common:`Dendrobium Orchid`,botanical:`Dendrobium nobile`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:7,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Needs a cool, dry winter rest to set buds. Fed and watered all winter it grows leaves instead of flowers.`,toxicity:{verdict:`non-toxic`,matched:`Dendrobium gracilicaule`,via:`genus-sibling`}},{id:`orchid-oncidium`,common:`Dancing Lady Orchid`,botanical:`Oncidium spp.`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:6,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Pleated leaves mean it went dry too long — the fold is permanent on that leaf, so judge by new growth.`,toxicity:{verdict:`non-toxic`,matched:`Oncidium flexuosum`,via:`genus-sibling`}},{id:`orchid-cattleya`,common:`Cattleya Orchid`,botanical:`Cattleya spp.`,group:`flowering`,light:`direct`,water:`dry-between`,baseDays:8,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Wants more light than a phalaenopsis: leaves should be mid-green, not dark. Flowers last two to three weeks.`,toxicity:{verdict:`non-toxic`,matched:`Cattleya labiata`,via:`genus-sibling`}},{id:`orchid-cymbidium`,common:`Cymbidium Orchid`,botanical:`Cymbidium spp.`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`2–3 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Needs a 10°C day-night swing in autumn to spike. Outdoors in early autumn is the usual trick.`,toxicity:{verdict:`unknown`}},{id:`orchid-jewel`,common:`Jewel Orchid`,botanical:`Ludisia discolor`,group:`flowering`,light:`medium`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`6–10 in`,feed:`light`,mist:!1,repotYears:2,notes:`Grown for the velvet leaves and their red veins; the flowers are small and white. Happy in a terrarium.`,toxicity:{verdict:`non-toxic`,matched:`Jewel Orchid`,via:`common`}},{id:`bromeliad-guzmania`,common:`Guzmania`,botanical:`Guzmania lingulata`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:8,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:0,notes:`Water into the central cup and flush it monthly. Flowers once, then pups — the parent is finishing, not sick.`,toxicity:{verdict:`non-toxic`,matched:`Guzmania musaica`,via:`genus-sibling`}},{id:`bromeliad-neoregelia`,common:`Neoregelia`,botanical:`Neoregelia carolinae`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:8,humidity:`high`,size:`1 ft`,feed:`light`,mist:!0,repotYears:0,notes:`The centre turns red as it comes into flower. Same cup watering, same one-and-done life cycle.`,toxicity:{verdict:`non-toxic`,matched:`Neoregelia spectabilis`,via:`genus-sibling`}},{id:`aechmea`,common:`Urn Plant`,botanical:`Aechmea fasciata`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:9,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!0,repotYears:0,notes:`The pink bract lasts months; the actual flowers are small and brief. Keep the cup topped up.`,toxicity:{verdict:`unknown`}},{id:`clivia`,common:`Clivia`,botanical:`Clivia miniata`,group:`flowering`,light:`medium`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:4,notes:`Needs six weeks cold and nearly dry in winter to flower. Resents being repotted and flowers better pot-bound.`,toxicity:{verdict:`toxic`,matched:`Clivia spp.`,via:`genus`}},{id:`amaryllis`,common:`Amaryllis`,botanical:`Hippeastrum spp.`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Flowers from the stored bulb. To rebloom, feed the leaves all summer, then rest it dry and dark for eight weeks.`,toxicity:{verdict:`toxic`,matched:`Hippeastrum spp.`,via:`botanical`}},{id:`cyclamen`,common:`Cyclamen`,botanical:`Cyclamen persicum`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:5,humidity:`average`,size:`6–10 in`,feed:`light`,mist:!1,repotYears:2,notes:`Wants a cool room, 12–16°C. Water from below only — the crown rots if water sits in it. Dormant in summer.`,toxicity:{verdict:`toxic`,matched:`Cyclamen spp`,via:`genus`}},{id:`gloxinia`,common:`Gloxinia`,botanical:`Sinningia speciosa`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:5,humidity:`high`,size:`8–12 in`,feed:`average`,mist:!1,repotYears:2,notes:`Furry leaves spot if splashed. Goes fully dormant after flowering; store the tuber dry and it returns.`,toxicity:{verdict:`non-toxic`,matched:`Sinningia speciosa`,via:`botanical`}},{id:`streptocarpus`,common:`Cape Primrose`,botanical:`Streptocarpus spp.`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:7,humidity:`average`,size:`8–12 in`,feed:`light`,mist:!1,repotYears:2,notes:`Flowers for most of the year in a bright north window. Related to African violets and watered the same way.`,toxicity:{verdict:`non-toxic`,matched:`Streptocarpus spp.`,via:`botanical`}},{id:`episcia`,common:`Flame Violet`,botanical:`Episcia cupreata`,group:`flowering`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`6–10 in`,feed:`light`,mist:!1,repotYears:2,notes:`Runs on stolons like a strawberry. Wants warmth — below 15°C it stops and rots at the crown.`,toxicity:{verdict:`non-toxic`,matched:`Episcia dianthiflora`,via:`genus-sibling`}},{id:`kohleria`,common:`Kohleria`,botanical:`Kohleria spp.`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Grows from scaly rhizomes and takes a dormant spell. Cut it back and keep it barely damp when it sulks.`,toxicity:{verdict:`non-toxic`,matched:`Kohleria lindeniana`,via:`genus-sibling`}},{id:`gardenia`,common:`Gardenia`,botanical:`Gardenia jasminoides`,group:`flowering`,light:`direct`,water:`evenly-moist`,baseDays:5,humidity:`high`,size:`2–4 ft`,feed:`heavy`,mist:!0,repotYears:2,notes:`Wants acidic soil, soft water and humidity, and drops buds if any one changes. The hardest plant on this list.`,toxicity:{verdict:`toxic`,matched:`Gardenia jasminoides`,via:`botanical`}},{id:`jasmine-polyanthum`,common:`Pink Jasmine`,botanical:`Jasminum polyanthum`,group:`flowering`,light:`direct`,water:`evenly-moist`,baseDays:5,humidity:`average`,size:`4–8 ft climbing`,feed:`average`,mist:!1,repotYears:2,notes:`Needs about six weeks below 13°C in autumn to set buds. A warm room all winter means no flowers.`,toxicity:{verdict:`non-toxic`,matched:`Jasminum species`,via:`genus`}},{id:`hibiscus`,common:`Tropical Hibiscus`,botanical:`Hibiscus rosa-sinensis`,group:`flowering`,light:`direct`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`3–6 ft`,feed:`heavy`,mist:!1,repotYears:2,notes:`Each flower lasts one day. Bud drop after a move or a dry spell is the plant reacting, not a pest.`,toxicity:{verdict:`non-toxic`,matched:`Hibiscus syriacus`,via:`genus-sibling`}},{id:`bougainvillea`,common:`Bougainvillea`,botanical:`Bougainvillea glabra`,group:`flowering`,light:`direct`,water:`dry-between`,baseDays:7,humidity:`low`,size:`4–10 ft`,feed:`average`,mist:!1,repotYears:3,notes:`Flowers hardest when kept slightly dry and slightly hungry. Well-fed and well-watered it makes leaves only.`,toxicity:{verdict:`unknown`}},{id:`citrus-meyer-lemon`,common:`Meyer Lemon`,botanical:`Citrus × meyeri`,group:`tree`,light:`direct`,water:`dry-between`,baseDays:7,humidity:`average`,size:`3–6 ft in a pot`,feed:`heavy`,mist:!1,repotYears:3,notes:`Needs six hours of direct sun to fruit indoors, and a citrus feed — yellow leaves are usually nitrogen, not water.`,toxicity:{verdict:`toxic`,matched:`Citrus Aurantium`,via:`genus-sibling`}},{id:`citrus-calamondin`,common:`Calamondin Orange`,botanical:`Citrus × microcarpa`,group:`tree`,light:`direct`,water:`dry-between`,baseDays:7,humidity:`average`,size:`2–4 ft`,feed:`heavy`,mist:!1,repotYears:3,notes:`The most reliable indoor citrus. Fruit is edible but sour; it hangs on the tree for months.`,toxicity:{verdict:`toxic`,matched:`Citrus Aurantium`,via:`genus-sibling`}},{id:`olive-tree`,common:`Olive Tree`,botanical:`Olea europaea`,group:`tree`,light:`direct`,water:`dry-between`,baseDays:12,humidity:`low`,size:`3–6 ft in a pot`,feed:`light`,mist:!1,repotYears:3,notes:`Wants a bright cold winter, not a warm dark one. Indoors year-round it slowly thins and drops leaves.`,toxicity:{verdict:`unknown`}},{id:`camellia`,common:`Camellia`,botanical:`Camellia japonica`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`3–6 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Acidic soil and a cool spot. Buds form in late summer, so a dry August is what costs you spring flowers.`,toxicity:{verdict:`non-toxic`,matched:`Camellia japonica`,via:`botanical`}},{id:`azalea-indoor`,common:`Indoor Azalea`,botanical:`Rhododendron simsii`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:4,humidity:`high`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Sold in flower, then usually killed by a warm room. It wants 10–15°C and soil that never dries.`,toxicity:{verdict:`toxic`,matched:`Rhododendron spp`,via:`genus`}},{id:`poinsettia`,common:`Poinsettia`,botanical:`Euphorbia pulcherrima`,group:`flowering`,light:`bright`,water:`dry-between`,baseDays:6,humidity:`average`,size:`1–3 ft`,feed:`light`,mist:!1,repotYears:2,notes:`The red is bracts, triggered by 14 hours of true darkness nightly for eight weeks. Milky sap irritates skin.`,toxicity:{verdict:`toxic`,matched:`Euphorbia pulcherrima`,via:`botanical`}},{id:`hoya-pubicalyx`,common:`Hoya Pubicalyx`,botanical:`Hoya pubicalyx`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:12,humidity:`average`,size:`4–8 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Never cut the bare stalk a flower cluster came from — next year's flowers come from that same spur.`,toxicity:{verdict:`non-toxic`,matched:`Hoya carnosa 'krinkle kurl'`,via:`genus-sibling`}},{id:`hoya-linearis`,common:`Hoya Linearis`,botanical:`Hoya linearis`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`high`,size:`2–4 ft trailing`,feed:`light`,mist:!0,repotYears:3,notes:`The one hoya that will not tolerate drying hard. Wants cool, humid air and fine bark, not compost.`,toxicity:{verdict:`non-toxic`,matched:`Hoya carnosa 'krinkle kurl'`,via:`genus-sibling`}},{id:`hoya-obovata`,common:`Hoya Obovata`,botanical:`Hoya obovata`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:13,humidity:`average`,size:`3–6 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Thick coin leaves store weeks of water. Splashed silver flecking is the plant, not a deficiency.`,toxicity:{verdict:`non-toxic`,matched:`Hoya carnosa 'krinkle kurl'`,via:`genus-sibling`}},{id:`hoya-compacta`,common:`Hindu Rope Hoya`,botanical:`Hoya carnosa 'Compacta'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:14,humidity:`average`,size:`2–4 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`The crumpled leaves trap water and mealybugs equally. Check inside the folds when something looks off.`,toxicity:{verdict:`non-toxic`,matched:`Hoya carnosa 'krinkle kurl'`,via:`genus-sibling`}},{id:`dischidia`,common:`Million Hearts`,botanical:`Dischidia ruscifolia`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`high`,size:`2–3 ft trailing`,feed:`light`,mist:!0,repotYears:3,notes:`An epiphyte — it wants bark and air at the roots. In dense compost it rots from the base within a season.`,toxicity:{verdict:`unknown`}},{id:`aeschynanthus`,common:`Lipstick Plant`,botanical:`Aeschynanthus radicans`,group:`vine`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`high`,size:`2–3 ft trailing`,feed:`average`,mist:!0,repotYears:2,notes:`Flowers on mature growth, so resist cutting it back hard. Leaf drop means cold, not thirst.`,toxicity:{verdict:`non-toxic`,matched:`Aeschynanthus humilis`,via:`genus-sibling`}},{id:`columnea`,common:`Goldfish Plant`,botanical:`Columnea gloriosa`,group:`vine`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`2–3 ft trailing`,feed:`average`,mist:!0,repotYears:2,notes:`Wants the same care as a lipstick plant. Buds abort if it dries out while they are forming.`,toxicity:{verdict:`unknown`}},{id:`philo-cordatum-lime`,common:`Neon Philodendron`,botanical:`Philodendron hederaceum 'Lemon Lime'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:9,humidity:`average`,size:`4–8 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Brightest chartreuse in good light; in a dim spot it goes plain green and the stems stretch.`,toxicity:{verdict:`toxic`,matched:`Philodendron spp`,via:`genus`}},{id:`cissus-discolor`,common:`Rex Begonia Vine`,botanical:`Cissus discolor`,group:`vine`,light:`bright`,water:`evenly-moist`,baseDays:6,humidity:`high`,size:`4–6 ft climbing`,feed:`average`,mist:!0,repotYears:2,notes:`Needs real humidity or it drops everything and dies back to the tuber. Often returns in spring if kept barely damp.`,toxicity:{verdict:`non-toxic`,matched:`Cissus dicolor`,via:`genus-sibling`}},{id:`senecio-wax-ivy`,common:`Wax Ivy`,botanical:`Curio macroglossus 'Variegatus'`,group:`vine`,light:`bright`,water:`arid`,baseDays:14,humidity:`low`,size:`3–5 ft trailing`,feed:`none`,mist:!1,repotYears:3,notes:`Looks like ivy, drinks like a succulent. Watered like ivy it collapses.`,toxicity:{verdict:`unknown`}},{id:`rhoicissus`,common:`Grape Ivy`,botanical:`Rhoicissus rhomboidea`,group:`vine`,light:`medium`,water:`dry-between`,baseDays:8,humidity:`average`,size:`4–8 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Tolerates offices and dim corners. Mildews in stagnant air — give it a little movement.`,toxicity:{verdict:`non-toxic`,matched:`Grape Ivy`,via:`common`}},{id:`hedera-needlepoint`,common:`Needlepoint Ivy`,botanical:`Hedera helix 'Needlepoint'`,group:`vine`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`3–6 ft trailing`,feed:`light`,mist:!0,repotYears:2,notes:`Spider mite is the usual end of an indoor ivy. Cool and humid keeps them off better than any spray.`,toxicity:{verdict:`toxic`,matched:`Hedera helix`,via:`genus-sibling`}},{id:`peperomia-caperata`,common:`Emerald Ripple Peperomia`,botanical:`Peperomia caperata`,group:`foliage`,light:`medium`,water:`dry-between`,baseDays:11,humidity:`average`,size:`8–10 in`,feed:`light`,mist:!1,repotYears:3,notes:`Deeply corrugated leaves. Water into the compost, not the crown, which rots readily.`,toxicity:{verdict:`non-toxic`,matched:`Peperomia caperata`,via:`botanical`}},{id:`peperomia-prostrata`,common:`String of Turtles`,botanical:`Peperomia prostrata`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:12,humidity:`average`,size:`1–2 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Tiny and slow. Buried strands root where they touch, so it thickens if you tuck them back in.`,toxicity:{verdict:`non-toxic`,matched:`Peperomia obtusifolia`,via:`genus-sibling`}},{id:`peperomia-polybotrya`,common:`Raindrop Peperomia`,botanical:`Peperomia polybotrya`,group:`foliage`,light:`bright`,water:`dry-between`,baseDays:12,humidity:`average`,size:`1 ft`,feed:`light`,mist:!1,repotYears:3,notes:`Often mistaken for a pilea. Thicker, more succulent leaves and a longer safe gap between waterings.`,toxicity:{verdict:`non-toxic`,matched:`Peperomia obtusifolia`,via:`genus-sibling`}},{id:`begonia-rhizomatous`,common:`Rhizomatous Begonia`,botanical:`Begonia 'Escargot'`,group:`flowering`,light:`medium`,water:`dry-between`,baseDays:8,humidity:`high`,size:`1 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Grows from a surface rhizome. Powdery mildew is the usual problem; airflow beats any treatment.`,toxicity:{verdict:`toxic`,matched:`Begonia spp.`,via:`genus`}},{id:`begonia-tuberous`,common:`Tuberous Begonia`,botanical:`Begonia × tuberhybrida`,group:`flowering`,light:`bright`,water:`evenly-moist`,baseDays:5,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Goes dormant in autumn. Store the tuber dry and frost-free and it comes back bigger.`,toxicity:{verdict:`toxic`,matched:`Begonia spp.`,via:`genus`}},{id:`saxifraga`,common:`Strawberry Begonia`,botanical:`Saxifraga stolonifera`,group:`foliage`,light:`medium`,water:`evenly-moist`,baseDays:6,humidity:`average`,size:`8 in plus runners`,feed:`light`,mist:!1,repotYears:2,notes:`Neither strawberry nor begonia. Sends out runners with plantlets that root in any pot you place under them.`,toxicity:{verdict:`unknown`}},{id:`chlorophytum-bonnie`,common:`Bonnie Spider Plant`,botanical:`Chlorophytum comosum 'Bonnie'`,group:`foliage`,light:`bright`,water:`evenly-moist`,baseDays:7,humidity:`average`,size:`1 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Curling leaves are the cultivar, not a problem. Same fluoride sensitivity as the plain spider plant.`,toxicity:{verdict:`non-toxic`,matched:`Chlorophytum comosum`,via:`genus-sibling`}},{id:`nephthytis-pink`,common:`Pink Syngonium`,botanical:`Syngonium podophyllum 'Neon Robusta'`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`average`,size:`3–5 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Juvenile leaves are arrowhead-shaped and pink; on a pole it matures into large lobed green leaves.`,toxicity:{verdict:`toxic`,matched:`Syngonium podophyllum`,via:`genus-sibling`}},{id:`tradescantia-pallida`,common:`Purple Heart`,botanical:`Tradescantia pallida`,group:`vine`,light:`direct`,water:`dry-between`,baseDays:9,humidity:`low`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`The purple needs real sun. In shade it greens and the stems run. Cuttings root in water in under a week.`,toxicity:{verdict:`toxic`,matched:`Tradescantia flumeninsis`,via:`genus-sibling`}},{id:`callisia`,common:`Turtle Vine`,botanical:`Callisia repens`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:8,humidity:`average`,size:`1–2 ft trailing`,feed:`light`,mist:!1,repotYears:2,notes:`Fast and cheap to replace, which is the honest reason to buy it. Goes bald at the centre — restart it yearly.`,toxicity:{verdict:`unknown`}},{id:`cyanotis`,common:`Teddy Bear Vine`,botanical:`Cyanotis kewensis`,group:`vine`,light:`bright`,water:`dry-between`,baseDays:10,humidity:`average`,size:`1–2 ft trailing`,feed:`light`,mist:!1,repotYears:3,notes:`Furry leaves mark if watered overhead, and the fuzz traps dust. Water at the soil line.`,toxicity:{verdict:`unknown`}},{id:`tarragon`,common:`French Tarragon`,botanical:`Artemisia dracunculus 'Sativa'`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:6,humidity:`low`,size:`2 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Only the French form has flavour, and it sets no seed — anything grown from seed is the tasteless Russian one.`,toxicity:{verdict:`toxic`,matched:`Artemisia dracunculus`,via:`genus-sibling`}},{id:`marjoram`,common:`Sweet Marjoram`,botanical:`Origanum majorana`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:6,humidity:`low`,size:`1 ft`,feed:`light`,mist:!1,repotYears:2,notes:`Sweeter and less peppery than oregano, and far less hardy. Treat it as an annual outside zone 9.`,toxicity:{verdict:`toxic`,matched:`Origanum majorana`,via:`botanical`}},{id:`bay`,common:`Bay Laurel`,botanical:`Laurus nobilis`,group:`herb`,light:`direct`,water:`dry-between`,baseDays:10,humidity:`low`,size:`3–6 ft in a pot`,feed:`light`,mist:!1,repotYears:3,notes:`Slow, long-lived, and happiest pot-bound. Scale insects on the leaf undersides are the usual problem.`,toxicity:{verdict:`toxic`,matched:`Laurus nobilis`,via:`botanical`}},{id:`lemongrass`,common:`Lemongrass`,botanical:`Cymbopogon citratus`,group:`herb`,light:`direct`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`3–4 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Thirsty and frost-tender. A supermarket stalk stood in water roots in a fortnight and becomes a plant.`,toxicity:{verdict:`toxic`,matched:`Cymbopogon citratus`,via:`botanical`}},{id:`chervil`,common:`Chervil`,botanical:`Anthriscus cerefolium`,group:`herb`,light:`medium`,water:`evenly-moist`,baseDays:4,humidity:`average`,size:`1–2 ft`,feed:`light`,mist:!1,repotYears:1,notes:`Bolts in heat and full sun. Sow it in succession in part shade and treat each sowing as six weeks of leaf.`,toxicity:{verdict:`non-toxic`,matched:`Anthriscus cerefolium`,via:`botanical`}},{id:`fennel-herb`,common:`Florence Fennel`,botanical:`Foeniculum vulgare`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:4,humidity:`low`,size:`3–5 ft`,feed:`average`,mist:!1,repotYears:2,notes:`Inhibits most neighbours — grow it on its own. Bolts to seed if it is checked by drought when young.` s warmth above 20°C to set fruit. Flea beetles shred the leaves of young plants — cover them early.`,toxicity:{verdict:`toxic`,matched:`Solanum spp`,via:`genus`}},{id:`broccoli`,common:`Broccoli`,botanical:`Brassica oleracea var. italica`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Cut the central head and it makes side shoots for weeks. Heat makes it bolt and go loose.`,toxicity:{verdict:`unknown`}},{id:`cauliflower`,common:`Cauliflower`,botanical:`Brassica oleracea var. botrytis`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`The fussiest brassica: any check in growth — drought, transplant shock, cold — gives a button head.`,toxicity:{verdict:`unknown`}},{id:`cabbage`,common:`Cabbage`,botanical:`Brassica oleracea var. capitata`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1–2 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Heads split after heavy rain following a dry spell. Harvest before, or twist the plant to break some roots.`,toxicity:{verdict:`unknown`}},{id:`brussels-sprouts`,common:`Brussels Sprouts`,botanical:`Brassica oleracea var. gemmifera`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`2–3 ft`,feed:`heavy`,mist:!1,repotYears:1,notes:`Needs a long season and firm soil. Sprouts that blow open usually mean loose planting, not bad seed.`,toxicity:{verdict:`unknown`}},{id:`chard`,common:`Swiss Chard`,botanical:`Beta vulgaris subsp. cicla`,group:`vegetable`,light:`direct`,water:`evenly-moist`,baseDays:3,humidity:`average`,size:`1–2 ft`,feed:`average`,mist:!1,repotYears:1,notes:`Crops for months from one sowing if you take outer leaves and leave the centre alone.`,toxicity:{verdict:`non-toxic`,matched:`Beta vulgaris`,via:`genus-sibling`}},{id:`beetroot`,common:`Beetroot`,botanical:`Beta vulgaris`
